services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realstore-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: realstore
      DB_USERNAME: realstore
      DB_PASSWORD: secret
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php artisan key:generate --force && php artisan migrate --force && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: realstore-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: realstore-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: realstore
      MYSQL_USER: realstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
